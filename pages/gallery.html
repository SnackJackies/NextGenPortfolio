<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Portoflio | Gallery</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="top-bar">
        <h1>Gallery</h1>
    </div>
    <div class="return" style="margin: 1.5em 5em;">
        <a href="../index.html" style="color: black; text-decoration: none;">← Return</a>
    </div>
    <section class="gallery-container fade-in">
        <div class="gallery-box fade-in">
            <div class="gallery-box-head">
                <button class="extend-button1 hoverable">></button>
                <h3 style="display: inline-block">This Year (2026) :</h3>
            </div>
            <div id="gallery-2026" class="gallery-hide">

            </div>
        </div>

        <div class="gallery-box fade-in">
            <div class="gallery-box-head">
                <button class="extend-button2 hoverable">></button>
                <h3 style="display: inline-block">Last Year (2025) :</h3>
            </div>
            <div id="gallery-2025" class="gallery-hide">

            </div>
        </div>
    </section>
    <script src="../js/script.js"></script>
</body>
</html>
